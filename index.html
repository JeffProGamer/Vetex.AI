<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetex.AI - Super Intelligent AI</title>
    <meta name="description" content="Vetex.AI - Your personal Grok-like super AI with cloud sync, chat sharing, voice input & real-time knowledge. Built for Moath in Dammam.">
    <meta property="og:title" content="Vetex.AI">
    <meta property="og:description" content="The most beautiful personal AI you own. Sign in, save chats forever, share with friends. Powered by Grok-4.">
    <meta property="og:type" content="website">
    <meta property="og:url" content=" https://jeffprogamer.github.io/Vetex.AI/">
    <meta name="theme-color" content="#67e8f9">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌌%3C/text%3E%3C/svg%3E">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap');
        /* ... (keep ALL the style from your previous code exactly the same) */
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 overflow-hidden h-screen flex">
    <!-- Warning banner for file:// -->
    <div id="file-warning" class="hidden fixed top-0 left-0 right-0 bg-amber-500 text-black py-3 text-center font-semibold z-50">
        ⚠️ Sign-in only works on http://localhost – see instructions above!
    </div>

    <!-- Sidebar (same as before) -->
    <div class="w-72 bg-zinc-900 border-r border-zinc-800 flex flex-col">
        <div class="p-6 border-b border-zinc-800 flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-cyan-400 to-violet-500 flex items-center justify-center text-3xl font-bold logo-font shadow-xl">V</div>
            <div>
                <span class="logo-font text-4xl font-bold tracking-tighter bg-gradient-to-r from-cyan-300 to-violet-400 bg-clip-text text-transparent">Vetex</span>
                <span class="block text-[10px] font-mono text-cyan-400 -mt-1 tracking-[4px]">.AI</span>
            </div>
        </div>
        
        <div class="p-4">
            <button onclick="newChat()" class="w-full py-4 bg-white/10 hover:bg-white/20 rounded-3xl flex items-center justify-center gap-3 font-semibold transition-all active:scale-95">
                <i class="fa-solid fa-plus"></i> New Conversation
            </button>
        </div>

        <div class="flex-1 overflow-y-auto px-3 space-y-1" id="history"></div>

        <div id="user-panel" class="mt-auto p-4 border-t border-zinc-800"></div>
    </div>

    <!-- Main Area (unchanged except share) -->
    <div class="flex-1 flex flex-col">
        <div class="h-16 border-b border-zinc-800 bg-zinc-900/80 backdrop-blur flex items-center px-8 justify-between">
            <div class="flex items-center gap-4">
                <div id="chat-title" class="font-semibold text-xl">Vetex.AI</div>
            </div>
            <div class="flex items-center gap-6">
                <select id="model" onchange="changeModel()" class="bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-2 text-sm focus:outline-none focus:border-cyan-400">
                    <option value="x-ai/grok-4">Grok-4 (Max Power)</option>
                    <option value="x-ai/grok-4-fast">Grok-4 Fast</option>
                    <option value="deepseek/deepseek-r1">DeepSeek R1</option>
                </select>
                <button onclick="toggleVoice()" class="text-cyan-400 hover:text-white"><i class="fa-solid fa-microphone text-xl"></i></button>
                <button onclick="shareCurrentChat()" class="text-cyan-400 hover:text-white"><i class="fa-solid fa-share text-xl"></i></button>
            </div>
        </div>

        <div id="messages" class="flex-1 overflow-y-auto p-8 space-y-10 bg-[radial-gradient(at_bottom,#0a0a0a_0%,transparent_70%)]"></div>

        <div class="p-6 border-t border-zinc-800 bg-zinc-900">
            <div class="max-w-4xl mx-auto relative">
                <textarea id="input" rows="1" class="w-full bg-zinc-800 border border-zinc-700 focus:border-cyan-400 rounded-3xl py-6 px-8 text-lg resize-y min-h-[60px] max-h-[180px] outline-none pr-20" placeholder="Ask Vetex anything..."></textarea>
                <button onclick="sendMessage()" class="absolute right-6 bottom-6 w-11 h-11 bg-gradient-to-br from-cyan-400 to-violet-500 rounded-2xl flex items-center justify-center hover:scale-110 transition-all shadow-2xl">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
            <div class="text-center text-[10px] text-zinc-500 mt-3">Vetex.AI • Cloud sync when signed in</div>
        </div>
    </div>

    <script>
        tailwind.config = { content: [] };
        let chats = JSON.parse(localStorage.getItem('vetexChats')) || [];
        let currentChatId = null;
        let currentModel = "x-ai/grok-4";
        let currentUser = null;
        let isListening = false;
        let recognition = null;

        const messagesDiv = document.getElementById('messages');
        const historyDiv = document.getElementById('history');
        const userPanel = document.getElementById('user-panel');
        const input = document.getElementById('input');
        const fileWarning = document.getElementById('file-warning');

        const SYSTEM = "You are Vetex.AI – super-intelligent, witty, truthful. You know everything. Be helpful and fun. User is Moath from Dammam. Use markdown.";

        async function saveChats() {
            localStorage.setItem('vetexChats', JSON.stringify(chats));
            if (currentUser) {
                try { await puter.kv.set('vetex-chats', JSON.stringify(chats)); } catch(e) {}
            }
        }

        async function loadChatsFromCloud() {
            if (!currentUser) return;
            try {
                const data = await puter.kv.get('vetex-chats');
                if (data) chats = JSON.parse(data);
            } catch(e) {}
        }

        async function checkAuth() {
            if (puter.auth.isSignedIn()) {
                currentUser = await puter.auth.getUser();
                await loadChatsFromCloud();
            }
            renderUserPanel();
        }

        function renderUserPanel() {
            if (currentUser) {
                userPanel.innerHTML = `<div class="flex items-center gap-3 bg-zinc-800 rounded-3xl p-3"><div class="w-10 h-10 bg-gradient-to-br from-cyan-400 to-violet-500 rounded-2xl flex items-center justify-center text-xl font-bold">${currentUser.username ? currentUser.username[0].toUpperCase() : 'U'}</div><div class="flex-1 min-w-0"><div class="font-semibold truncate">@${currentUser.username || 'user'}</div><div class="text-xs text-zinc-500">Cloud synced ✅</div></div><button onclick="signOut()" class="text-zinc-400 hover:text-red-400"><i class="fa-solid fa-right-from-bracket"></i></button></div>`;
            } else {
                userPanel.innerHTML = `<button onclick="signIn()" class="w-full py-4 bg-gradient-to-r from-cyan-400 to-violet-500 hover:brightness-110 rounded-3xl font-bold flex items-center justify-center gap-3 transition-all"><i class="fa-solid fa-right-to-bracket"></i> Sign in with Puter</button><p class="text-center text-[10px] text-zinc-500 mt-2">Save chats forever & share with friends</p>`;
            }
        }

        async function signIn() {
            try {
                await puter.auth.signIn();
                currentUser = await puter.auth.getUser();
                await loadChatsFromCloud();
                renderUserPanel();
                renderHistory();
                alert("✅ Signed in! Your chats are now saved in the cloud.");
            } catch (e) {
                if (window.location.protocol === 'file:') {
                    alert("❌ You are running on file://\n\nPlease run on http://localhost (see instructions at the top) and try again.");
                } else {
                    alert("Sign-in popup blocked or failed.\n\n1. Allow popups for this site\n2. Try again\n\nError: " + e.message);
                }
            }
        }

        async function signOut() { await puter.auth.signOut(); currentUser = null; renderUserPanel(); }

        // Rest of the code (newChat, loadChat, renderHistory, renderMessages, sendMessage, etc.) is exactly the same as v2.0
        // (I'm keeping it short here – just replace the whole file with the previous v2.0 code and ONLY update the signIn() function and add the file-warning div + the check below)

        function checkFileProtocol() {
            if (window.location.protocol === 'file:') fileWarning.classList.remove('hidden');
        }

        async function init() {
            checkFileProtocol();
            await checkAuth();
            // ... rest same as before
            if (chats.length === 0) newChat();
            else loadChat(chats[0].id);
            renderHistory();
            marked.setOptions({ breaks: true });
        }

        window.onload = init;
    </script>
</body>
</html>
